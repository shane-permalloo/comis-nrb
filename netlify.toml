[build]
  command = "cd frontend && npm install && npx ng build --configuration production"
  publish = "frontend/dist/frontend/browser"
  functions = "netlify/functions"

[dev]
  command = "npm --prefix frontend run start -- --port 4200"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**"]

# Redirect /api/* to the Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Allow cross-origin requests to the API
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# SPA fallback for Angular routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
